<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>2048 AI Control Center</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23edc22e'/><text y='68' x='50' text-anchor='middle' font-size='42' font-family='sans-serif' font-weight='700' fill='%23fff'>2048</text></svg>">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">2048</div>
      <div class="brand-text">
        <h1>AI Control Center</h1>
        <p>local · zero dependencies</p>
      </div>
    </div>
    <nav class="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <span id="foot-version">—</span>
      <button class="btn btn-ghost btn-sm" id="theme-toggle" title="Toggle theme"
              aria-label="Toggle light and dark theme">◐</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost menu-btn" id="menu-btn" aria-label="Open navigation">☰</button>
      <div>
        <h2 id="page-title">Overview</h2>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="topbar-right">
        <div id="page-actions" class="btn-row"></div>
        <span class="pill idle" id="global-status"><i></i><span>—</span></span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/charts.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/views/overview.js"></script>
<script src="/static/js/views/training.js"></script>
<script src="/static/js/views/play.js"></script>
<script src="/static/js/views/evaluate.js"></script>
<script src="/static/js/views/compare.js"></script>
<script src="/static/js/views/experiments.js"></script>
<script src="/static/js/views/checkpoints.js"></script>
<script src="/static/js/views/benchmarks.js"></script>
<script src="/static/js/views/misc.js"></script>
<script src="/static/js/shell.js"></script>
</body>
</html>
